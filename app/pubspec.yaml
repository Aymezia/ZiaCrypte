name: ziacrypte
description: Application de messagerie chiffrée ZiaCrypte
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.6.2
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  dio: ^5.7.0
  ffi: ^2.1.3
  # flutter_secure_storage : à réintroduire (version à jour) quand on persistera
  # les jetons de session. La 9.2.x casse le build Linux (json.hpp obsolète).

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.3
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  ffigen: ^13.0.0
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
