name: ziacrypte
description: Application de messagerie chiffrée ZiaCrypte
publish_to: 'none'
version: 0.13.0

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.6.2
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  dio: ^5.7.0
  ffi: ^2.1.3
  file_picker: ^11.0.2
  qr_flutter: ^4.1.0
  record: ^5.2.1
  audioplayers: ^6.1.0
  path_provider: ^2.1.4
  url_launcher: ^6.3.0
  flutter_webrtc: ^1.5.2
  # flutter_secure_storage : à réintroduire (version à jour) quand on persistera
  # les jetons de session. La 9.2.x casse le build Linux (json.hpp obsolète).

dependency_overrides:
  # record 5.2.1 fige un record_linux 0.7.2 périmé, cassé contre l'interface
  # 1.6.0 qu'il tire lui-même. La 2.x exige un SDK Dart trop récent (3.12+).
  # La 1.3.1 vise l'interface ^1.5.0 et le SDK ^3.5.0 : c'est le point d'accord.
  record_linux: 1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.3
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  ffigen: ^13.0.0
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
