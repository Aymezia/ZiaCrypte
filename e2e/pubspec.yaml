name: zia_e2e
description: >
  Test end-to-end du système assemblé : moteur cryptographique natif (FFI) +
  client Dart + serveur Fastify + PostgreSQL. Paquet Dart pur (pas Flutter) pour
  pouvoir être exécuté par `dart run` en CI comme en local.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  ffi: ^2.1.3
  http: ^1.2.0
