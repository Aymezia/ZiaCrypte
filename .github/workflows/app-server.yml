name: app-server

# CI de l'application Flutter et du backend Node.js. Déclenché indépendamment du
# moteur C++ (chemins distincts) pour garder des pipelines par module.

on:
  push:
    paths:
      - 'app/**'
      - 'server/**'
      - 'protocol/**'
      - '.github/workflows/app-server.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'server/**'
      - 'protocol/**'

jobs:
  server:
    name: server (Node.js)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ziacrypte
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: ziacrypte
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ziacrypte:changeme@localhost:5432/ziacrypte
      JWT_ACCESS_SECRET: ci-access-secret-0123456789
      JWT_REFRESH_SECRET: ci-refresh-secret-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install
        working-directory: server
        run: npm ci
      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate
      - name: Apply schema to database
        working-directory: server
        run: npx prisma db push --skip-generate
      - name: Type-check / build
        working-directory: server
        run: npm run build
      - name: Test
        working-directory: server
        run: npm test

  app:
    name: app (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Le moteur natif est requis pour le test d'intégration FFI.
      - name: Build native crypto engine
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libsodium-dev libsecret-1-dev
          cd crypto-engine
          cmake --preset linux-system
          cmake --build --preset linux-system

      - name: Install
        working-directory: app
        run: flutter pub get
      - name: Analyze
        working-directory: app
        run: flutter analyze
      - name: Test (unit + FFI integration)
        working-directory: app
        env:
          ZIA_CRYPTO_LIB: ${{ github.workspace }}/crypto-engine/build/linux-system/src/libzia_crypto.so
        # dbus-run-session fournit le Secret Service (libsecret) requis par la
        # persistance de session testée à travers le FFI.
        run: |
          sudo apt-get install -y gnome-keyring dbus-x11
          dbus-run-session -- bash -c '
            echo "" | gnome-keyring-daemon --unlock --components=secrets
            flutter test'
