name: crypto-engine

# CI bloquante du moteur C++ : uniquement Linux, avec libsodium système (pas de
# vcpkg), car c'est la configuration validée de bout en bout — build ET
# exécution du test de conformité. Les autres plateformes (Windows/macOS/iOS/
# Android), qui nécessitent des runners dédiés non encore validés, vivent dans
# le workflow manuel crypto-engine-crossbuild.yml.

on:
  push:
    paths:
      - 'crypto-engine/**'
      - '.github/workflows/crypto-engine.yml'
  pull_request:
    paths:
      - 'crypto-engine/**'

jobs:
  linux:
    name: linux (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libsodium-dev libsecret-1-dev \
                                  gnome-keyring dbus-x11

      - name: Configure
        working-directory: crypto-engine
        run: cmake --preset linux-system

      - name: Build
        working-directory: crypto-engine
        run: cmake --build --preset linux-system

      - name: Test
        working-directory: crypto-engine
        # Le Secret Service (libsecret) est requis par le test de persistance de
        # session ; dbus-run-session + gnome-keyring le fournissent en headless.
        run: |
          dbus-run-session -- bash -c '
            echo "" | gnome-keyring-daemon --unlock --components=secrets
            ctest --preset linux-system --output-on-failure'
