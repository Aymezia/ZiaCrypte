name: crypto-engine

# CI bloquante du moteur C++ : uniquement Linux, avec libsodium système (pas de
# vcpkg), car c'est la configuration validée de bout en bout — build ET
# exécution du test de conformité. Les autres plateformes (Windows/macOS/iOS/
# Android), qui nécessitent des runners dédiés non encore validés, vivent dans
# le workflow manuel crypto-engine-crossbuild.yml.

on:
  push:
    paths:
      - 'crypto-engine/**'
      - '.github/workflows/crypto-engine.yml'
  pull_request:
    paths:
      - 'crypto-engine/**'

jobs:
  linux:
    name: linux (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libsodium-dev libsecret-1-dev \
                                  gnome-keyring dbus-x11

      # liboqs (ML-KEM-768, PQXDH) : aucune distribution ne l'empaquette
      # encore. Compilé ici en version épinglée, ML-KEM seul, et SANS OpenSSL —
      # le moteur ne dépend que de libsodium, faire entrer OpenSSL doublerait
      # la surface cryptographique pour rien.
      - name: Construire liboqs
        run: |
          git clone --depth 1 --branch 0.14.0 https://github.com/open-quantum-safe/liboqs.git /tmp/liboqs
          cmake -S /tmp/liboqs -B /tmp/liboqs/build -GNinja \
                -DCMAKE_BUILD_TYPE=Release \
                -DOQS_MINIMAL_BUILD=KEM_ml_kem_768 \
                -DOQS_USE_OPENSSL=OFF \
                -DOQS_BUILD_ONLY_LIB=ON \
                -DBUILD_SHARED_LIBS=OFF
          sudo cmake --build /tmp/liboqs/build --target install

      - name: Configure
        working-directory: crypto-engine
        run: cmake --preset linux-system

      - name: Build
        working-directory: crypto-engine
        run: cmake --build --preset linux-system

      - name: Test
        working-directory: crypto-engine
        # Le Secret Service (libsecret) est requis par le test de persistance de
        # session ; dbus-run-session + gnome-keyring le fournissent en headless.
        run: |
          dbus-run-session -- bash -c '
            echo "" | gnome-keyring-daemon --unlock --components=secrets
            ctest --preset linux-system --output-on-failure'

  # Désinfecteurs + fuzzing sur les points d'entrée qui reçoivent des octets
  # venus de l'extérieur. Les tests de conformité n'exercent que des entrées
  # valides : ils vérifient que le protocole fonctionne, pas qu'il résiste à ce
  # qui est malformé.
  hardening:
    name: linux (ASan/UBSan + fuzzing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm cmake ninja-build libsodium-dev libsecret-1-dev

      # liboqs (ML-KEM-768, PQXDH) : aucune distribution ne l'empaquette
      # encore. Compilé ici en version épinglée, ML-KEM seul, et SANS OpenSSL —
      # le moteur ne dépend que de libsodium, faire entrer OpenSSL doublerait
      # la surface cryptographique pour rien.
      - name: Construire liboqs
        run: |
          git clone --depth 1 --branch 0.14.0 https://github.com/open-quantum-safe/liboqs.git /tmp/liboqs
          cmake -S /tmp/liboqs -B /tmp/liboqs/build -GNinja \
                -DCMAKE_BUILD_TYPE=Release \
                -DOQS_MINIMAL_BUILD=KEM_ml_kem_768 \
                -DOQS_USE_OPENSSL=OFF \
                -DOQS_BUILD_ONLY_LIB=ON \
                -DBUILD_SHARED_LIBS=OFF
          sudo cmake --build /tmp/liboqs/build --target install

      # Aucun service de trousseau n'existe sur un runner. Le moteur doit
      # échouer franchement plutôt que d'attendre indéfiniment — un délai court
      # rend le défaut visible ici s'il revenait.
      - name: Build + test sous ASan/UBSan
        env:
          ZIA_KEYSTORE_TIMEOUT_SECONDS: 2
        run: |
          cd crypto-engine
          cmake --preset linux-sanitizers
          cmake --build build/linux-sanitizers -j"$(nproc)"
          ctest --test-dir build/linux-sanitizers --output-on-failure

      - name: Fuzzing (budget court)
        env:
          ZIA_KEYSTORE_TIMEOUT_SECONDS: 2
        run: |
          cd crypto-engine
          cmake --preset linux-fuzz
          cmake --build build/linux-fuzz -j"$(nproc)"
          ./scripts/run-fuzzers.sh "${ZIA_FUZZ_SECONDS:-120}"

      # Les entrées fautives sont l'unique moyen de rejouer un défaut trouvé :
      # sans elles, le rapport d'échec ne sert à rien.
      - name: Conserver les entrées fautives
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: |
            crypto-engine/crash-*
            crypto-engine/build/linux-fuzz/fuzz.log
          if-no-files-found: ignore
