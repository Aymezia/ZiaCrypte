name: build-apps

# Construit l'application de bureau pour les plateformes qu'on ne peut PAS
# compiler depuis Linux (Windows exige MSVC, macOS exige Xcode). Déclenchable à
# la main, et automatiquement à la publication d'une release — les artefacts y
# sont alors attachés.

# Le jeton par défaut est en lecture seule sur les releases : sans cette
# permission, les étapes « Attach to release » échouent en HTTP 403 alors que
# les binaires ont été construits correctement, et la release part incomplète.
permissions:
  contents: write

env:
  ZIA_SERVER_URL: https://51.83.199.103.nip.io
  # Clé publique de vérification des mises à jour (la privée reste hors CI).
  ZIA_UPDATE_PUBKEY: ovIl8hVTU9GEtjODO3Pp9HaF5QCXx+jTiZKzM2xVuN4=

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  # Le moteur pour Windows est cross-compilé depuis Linux avec MinGW et lié
  # STATIQUEMENT (libsodium + runtimes C++). Un build sur le runner Windows
  # produisait une DLL réclamant libgcc_s_seh-1.dll / libstdc++-6.dll, absentes
  # de la machine cible : l'application échouait au chargement (erreur 126).
  engine-windows:
    name: Moteur Windows (autonome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 curl make
      - name: Cross-build
        run: ./crypto-engine/scripts/build-windows-mingw.sh
      - name: Vérifier l'autonomie de la DLL
        run: |
          set -euo pipefail
          DLL=dist/windows-x64/zia_crypto.dll
          test -f "$DLL"
          # Aucune dépendance hors DLL système Windows.
          if x86_64-w64-mingw32-objdump -p "$DLL" | grep -qiE "libgcc|libstdc\+\+|libsodium"; then
            echo "La DLL n'est pas autonome :"; x86_64-w64-mingw32-objdump -p "$DLL" | grep "DLL Name"
            exit 1
          fi
          x86_64-w64-mingw32-objdump -p "$DLL" | grep "DLL Name"
      - uses: actions/upload-artifact@v4
        with:
          name: engine-windows-dll
          path: dist/windows-x64/zia_crypto.dll

  windows:
    name: Application Windows
    runs-on: windows-latest
    needs: engine-windows
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer le moteur autonome
        uses: actions/download-artifact@v4
        with:
          name: engine-windows-dll
          path: engine-dll

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build Flutter app
        working-directory: app
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          $ver = (Select-String -Path pubspec.yaml -Pattern '^version:' | Select-Object -First 1).Line -replace '^version:\s*','' -replace '\+.*$',''
          Write-Host "version : $ver"
          flutter build windows --release --dart-define=ZIA_SERVER_URL=$env:ZIA_SERVER_URL --dart-define=ZIA_VERSION=$ver --dart-define=ZIA_UPDATE_PUBKEY=$env:ZIA_UPDATE_PUBKEY

      - name: Assemble bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bundle = "app/build/windows/x64/runner/Release"

          # Moteur autonome produit par le job engine-windows (libsodium et les
          # runtimes C++ sont liés statiquement : rien d'autre à livrer).
          if (-not (Test-Path "engine-dll/zia_crypto.dll")) { throw "moteur introuvable" }
          Copy-Item "engine-dll/zia_crypto.dll" "$bundle/zia_crypto.dll"

          # Vérification : l'archive doit contenir l'exécutable ET le moteur.
          foreach ($f in @("ziacrypte.exe", "zia_crypto.dll")) {
            if (-not (Test-Path "$bundle/$f")) { throw "manquant dans le bundle : $f" }
          }
          Get-ChildItem $bundle | Select-Object Name, Length | Format-Table

          Compress-Archive -Path "$bundle/*" -DestinationPath ziacrypte-windows-x64-app.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ziacrypte-windows-x64-app
          path: ziacrypte-windows-x64-app.zip

      - name: Attach to release
        if: github.event_name == 'release'
        run: gh release upload ${{ github.event.release.tag_name }} ziacrypte-windows-x64-app.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos:
    name: Application macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build crypto engine
        working-directory: crypto-engine
        run: |
          brew install libsodium
          cmake --preset linux-system   # le repli pkg-config marche aussi sur macOS
          cmake --build --preset linux-system

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build Flutter app
        working-directory: app
        run: |
          flutter config --enable-macos-desktop
          flutter pub get
          ver=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//' | cut -d+ -f1)
          echo "version : $ver"
          flutter build macos --release --dart-define=ZIA_SERVER_URL=$ZIA_SERVER_URL --dart-define=ZIA_VERSION=$ver --dart-define=ZIA_UPDATE_PUBKEY=$ZIA_UPDATE_PUBKEY

      - name: Assemble bundle
        run: |
          set -euo pipefail
          APP=$(find app/build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -1)
          DYLIB=$(find crypto-engine/build -name "libzia_crypto*.dylib" | head -1)
          [ -n "$APP" ] || { echo "bundle .app introuvable"; exit 1; }
          [ -n "$DYLIB" ] || { echo "moteur .dylib introuvable"; exit 1; }
          mkdir -p "$APP/Contents/Frameworks"
          cp "$DYLIB" "$APP/Contents/Frameworks/libzia_crypto.dylib"
          test -f "$APP/Contents/Frameworks/libzia_crypto.dylib"
          ditto -c -k --keepParent "$APP" ziacrypte-macos-x64-app.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ziacrypte-macos-app
          path: ziacrypte-macos-x64-app.zip

      - name: Attach to release
        if: github.event_name == 'release'
        run: gh release upload ${{ github.event.release.tag_name }} ziacrypte-macos-x64-app.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
