# Serveur TURN (coturn) pour les appels chiffrés de ZiaCrypte.
#
# Le média est chiffré de bout en bout par WebRTC (DTLS-SRTP) : ce relais ne
# transporte que des octets qu'il ne peut pas déchiffrer. Son seul rôle est de
# faire passer le flux quand une connexion directe échoue.
#
# Le secret d'authentification n'est PAS dans ce fichier : il est passé en
# argument par docker-compose (--static-auth-secret=$TURN_SHARED_SECRET), et
# doit être IDENTIQUE à la variable TURN_SHARED_SECRET du serveur, qui dérive
# les identifiants à durée limitée par HMAC.

listening-port=3478
tls-listening-port=5349
fingerprint

# TURN REST API : identifiants horodatés vérifiés par HMAC. Pas de comptes.
use-auth-secret

realm=ziacrypte

# Plage de ports de relais. À ouvrir sur le pare-feu / publier dans compose.
min-port=49160
max-port=49200

# --- Durcissement anti-SSRF (impératif) --------------------------------------
#
# Un TURN ouvert peut être détourné pour joindre des services INTERNES depuis
# l'extérieur (métadonnées cloud, bases de données, réseau privé). On refuse
# donc explicitement toute plage privée, le loopback et le lien-local comme
# destinataires du relais. Sans ces règles, le relais devient un proxy vers
# l'intérieur du réseau.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Pas d'interface d'admin en ligne de commande (surface d'attaque inutile).
no-cli
# Journalisation minimale : pas de mot de passe ni d'IP en clair dans les logs.
no-stdout-log
syslog

# TLS pour turns:5349 — décommenter et monter les certificats en production.
# cert=/etc/coturn/certs/fullchain.pem
# pkey=/etc/coturn/certs/privkey.pem
